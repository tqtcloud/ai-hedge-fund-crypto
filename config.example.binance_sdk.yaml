# Binance官方SDK配置示例
# 基于binance-connector-python项目的完整配置示例

mode: backtest # backtest, live, paper
start_date: 2025-08-30
end_date: 2025-09-04
primary_interval: 1h
initial_cash: 1000
margin_requirement: 0.0
show_reasoning: true
show_agent_graph: false

signals:
  intervals: ["30m", "1h", "4h", "15m", "5m"]
  tickers: ["BNBUSDT"]
  strategies: ['MacdStrategy', 'RSIStrategy']

model:
  name: "ep-20250722234153-nsm5d"
  provider: "openai"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"

# 环境切换配置
environment:
  active: "development"
  profiles:
    development:
      futures_environment: testnet
      log_level: "DEBUG"
      enable_detailed_logging: true
    testing:
      futures_environment: testnet
      log_level: "INFO"
      enable_detailed_logging: false
    staging:
      futures_environment: testnet
      log_level: "WARNING" 
      enable_detailed_logging: false
    production:
      futures_environment: mainnet
      log_level: "ERROR"
      enable_detailed_logging: false

# 期货交易配置
futures:
  environment: testnet
  api:
    testnet:
      base_url: "https://testnet.binancefuture.com"
      api_url: "https://testnet.binancefuture.com/fapi/v1"
      websocket_url: "wss://stream.binancefuture.com/ws"
      websocket_stream_url: "wss://stream.binancefuture.com/stream"
    mainnet:
      base_url: "https://fapi.binance.com"
      api_url: "https://fapi.binance.com/fapi/v1"
      websocket_url: "wss://fstream.binance.com/ws"
      websocket_stream_url: "wss://fstream.binance.com/stream"
    timeout: 10
    max_retries: 3
    retry_delay: 1.0
  margin_type: CROSSED
  symbols: ["BTCUSDT", "ETHUSDT", "BNBUSDT"]
  default_leverage:
    BTCUSDT: 10
    ETHUSDT: 10
    BNBUSDT: 5
  allowed_order_types: ["MARKET", "LIMIT", "STOP", "TAKE_PROFIT"]
  min_order_size:
    BTCUSDT: 0.001
    ETHUSDT: 0.01
    BNBUSDT: 0.1
  price_precision:
    BTCUSDT: 2
    ETHUSDT: 2
    BNBUSDT: 4
  quantity_precision:
    BTCUSDT: 3
    ETHUSDT: 2
    BNBUSDT: 1
  risk:
    max_leverage: 20
    max_position_size: 1000.0
    stop_loss_percentage: 0.02
    take_profit_percentage: 0.05
    daily_loss_limit: 500.0
    max_open_positions: 5
    margin_requirement: 0.1
  websocket:
    enable_user_data_stream: true
    enable_market_data_stream: true
    reconnect_interval: 5
    max_reconnect_attempts: 10
    heartbeat_interval: 30
    buffer_size: 1024
    connection_timeout: 10
    ping_interval: 20
    pong_timeout: 10
  security:
    api_key_env: "BINANCE_FUTURES_API_KEY"
    secret_key_env: "BINANCE_FUTURES_SECRET_KEY"
    enable_signature: true
    recv_window: 5000
    verify_ssl: true
    enable_ip_whitelist: false
  monitoring:
    enable_performance_monitoring: true
    enable_detailed_logging: false
    log_level: "INFO"
    metrics_collection_interval: 60
    health_check_interval: 30

# 官方 binance-connector-python SDK 配置
binance_sdk:
  # API认证配置
  api:
    key: "${BINANCE_API_KEY}"
    secret: "${BINANCE_API_SECRET}"
    private_key_path: null  # RSA私钥路径 (可选)
    private_key_passphrase: null  # 私钥密码短语 (可选)
  
  # 环境配置
  environment:
    type: "testnet"  # testnet/mainnet
    auto_detect: true  # 自动检测环境
  
  # REST API配置
  rest_api:
    timeout: 10000  # 请求超时时间(毫秒)
    retries: 3  # 重试次数
    backoff: 1000  # 重试延迟(毫秒)
    keep_alive: true  # HTTP keep-alive
    compression: true  # 响应压缩
    
    # 代理配置
    proxy:
      enabled: false
      host: null
      port: null
      protocol: "http"  # http/https
      auth:
        username: null
        password: null
  
  # WebSocket API配置  
  websocket_api:
    timeout: 10000  # 超时时间(毫秒)
    reconnect_delay: 5000  # 重连延迟(毫秒)
    compression: 0  # 压缩级别 (0=禁用)
    pool_size: 3  # 连接池大小
    mode: "single"  # single/pool
    
    # 代理配置
    proxy:
      enabled: false
      host: null
      port: null
      protocol: "http"
      auth:
        username: null
        password: null
  
  # WebSocket流配置
  websocket_streams:
    timeout: 10000
    reconnect_delay: 5000
    compression: 0
    pool_size: 3
    mode: "single"
    user_agent: "ai-hedge-fund-crypto/1.0"
    
    # 代理配置
    proxy:
      enabled: false
      host: null
      port: null
      protocol: "http"
      auth:
        username: null
        password: null
  
  # 网络配置
  network:
    # HTTPS代理全局配置
    https_agent:
      verify_ssl: true
      custom_ca_path: null  # 自定义CA证书路径
      
  # 端点配置 (覆盖默认值)
  endpoints:
    # 自定义端点URL (可选)
    rest_api_base_url: null  # 如果为null则使用SDK默认值
    websocket_api_url: null
    websocket_streams_url: null

# 增强版市场分析器配置
enhanced_market_analyzer:
  # 基础配置
  enable_real_time: true  # 启用实时数据流
  enable_async: true  # 启用异步处理
  cache_timeout: 300  # 缓存超时时间(秒)
  data_quality_threshold: 0.8  # 数据质量阈值
  
  # WebSocket连接配置
  websocket:
    reconnect_delay: 5000  # 重连延迟(毫秒)
    max_reconnect_attempts: 10  # 最大重连次数
    connection_timeout: 10000  # 连接超时(毫秒)
    heartbeat_interval: 30  # 心跳间隔(秒)
  
  # 数据流配置
  streams:
    # 支持的K线时间间隔
    supported_intervals: ["1m", "3m", "5m", "15m", "30m", "1h", "2h", "4h", "6h", "8h", "12h", "1d", "3d", "1w", "1M"]
    
    # 默认启动的时间间隔
    default_intervals: ["1m", "5m", "1h"]
    
    # 数据缓冲区大小
    kline_buffer_size: 1000  # K线数据缓冲区大小
    trade_buffer_size: 500   # 交易数据缓冲区大小
    
    # 深度数据配置
    depth_levels: 20  # 深度数据档位数
    depth_update_speed: "100ms"  # 深度数据更新频率
  
  # 技术分析配置
  technical_analysis:
    # 波动率计算周期
    volatility_periods: [21, 63, 252]
    
    # 技术指标周期
    technical_periods:
      rsi: [14, 28]
      ema: [9, 21, 50, 200]
      bb: 20
      atr: 14
      adx: 14
    
    # 风险计算配置
    var_confidence_levels: [0.95, 0.99]
    risk_periods: [1, 5, 21]
  
  # 市场条件阈值
  market_thresholds:
    trend_strength_min: 0.6
    volatility_regime_boundaries: [0.8, 1.2]
    liquidity_thresholds: [0.2, 0.5, 1.5, 2.5]
    sentiment_extremes: [0.2, 0.8]
  
  # 性能优化配置
  performance:
    # 并发处理
    max_concurrent_requests: 10  # 最大并发请求数
    request_rate_limit: 100      # 每秒请求限制
    
    # 内存管理
    max_cache_entries: 10000     # 最大缓存条目数
    cache_cleanup_interval: 600  # 缓存清理间隔(秒)
    
    # CPU优化
    use_multiprocessing: false   # 是否使用多进程
    worker_processes: 2          # 工作进程数
  
  # 数据质量控制
  quality_control:
    # 数据有效性检查
    enable_data_validation: true
    max_price_deviation: 0.1     # 最大价格偏差(10%)
    max_volume_deviation: 2.0    # 最大成交量偏差(200%)
    
    # 异常数据处理
    outlier_detection: true      # 启用异常值检测
    outlier_threshold: 3.0       # 异常值阈值(标准差倍数)
    
    # 数据完整性检查
    min_data_points: 20          # 分析所需最小数据点数
    max_missing_ratio: 0.1       # 最大缺失数据比例
  
  # 监控和日志配置
  monitoring:
    enable_performance_monitoring: true  # 启用性能监控
    enable_detailed_logging: false       # 启用详细日志
    log_level: "INFO"                   # 日志级别
    
    # 指标收集
    metrics_collection_interval: 60     # 指标收集间隔(秒)
    health_check_interval: 30           # 健康检查间隔(秒)
    
    # 告警配置
    enable_alerts: true                 # 启用告警
    alert_thresholds:
      connection_failure_count: 5       # 连接失败告警阈值
      data_delay_seconds: 300          # 数据延迟告警阈值
      error_rate_percent: 10           # 错误率告警阈值

# 测试环境配置
test_config:
  # 测试交易对
  test_symbols: ["BTCUSDT", "ETHUSDT", "BNBUSDT"]
  
  # 测试时间间隔
  test_intervals: ["1m", "5m", "1h"]
  
  # 测试持续时间
  test_duration_seconds: 60
  
  # 模拟数据配置
  mock_data:
    enable_mock_mode: true              # 启用模拟模式
    base_prices:
      BTCUSDT: 50000.0
      ETHUSDT: 3000.0
      BNBUSDT: 300.0
    price_volatility: 0.02              # 价格波动率(2%)
    update_interval_seconds: 1          # 更新间隔