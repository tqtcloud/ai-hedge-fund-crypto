mode: live # backtest, live, paper
start_date: 2025-08-30
end_date: 2025-09-04
primary_interval: 1h
initial_cash: 1000
margin_requirement: 0.0
show_reasoning: true
show_agent_graph: false
signals:
  intervals: ["3m", "5m", "15m", "30m", "1h", "4h"]  # 要分析的时间框架
  tickers: ["BNBUSDT"]
  strategies: ['MacdStrategy', 'RSIStrategy']
model:
  name: "ep-20250722234153-nsm5d" # choose your model.
  provider: "openai"  # llm provider.
  base_url: "https://ark.cn-beijing.volces.com/api/v3"  # you can change it to your own.

# 环境切换配置
environment:
  # 当前激活环境
  active: "development"  # development | testing | staging | production
  
  # 环境特定配置
  profiles:
    development:
      futures_environment: testnet
      log_level: "DEBUG"
      enable_detailed_logging: true
      
    testing:
      futures_environment: testnet
      log_level: "INFO"
      enable_detailed_logging: false
      
    staging:
      futures_environment: testnet
      log_level: "WARNING" 
      enable_detailed_logging: false
      
    production:
      futures_environment: mainnet  # 生产环境可使用mainnet，但需谨慎
      log_level: "ERROR"
      enable_detailed_logging: false

# 期货交易配置
futures:
  # 环境配置 (默认使用testnet确保安全)
  environment: testnet  # testnet | mainnet
  
  # API端点配置
  api:
    # 测试网API端点
    testnet:
      base_url: "https://testnet.binancefuture.com"
      api_url: "https://testnet.binancefuture.com/fapi/v1"
      websocket_url: "wss://stream.binancefuture.com/ws"
      websocket_stream_url: "wss://stream.binancefuture.com/stream"
      
    # 主网API端点  
    mainnet:
      base_url: "https://fapi.binance.com"
      api_url: "https://fapi.binance.com/fapi/v1"
      websocket_url: "wss://fstream.binance.com/ws"
      websocket_stream_url: "wss://fstream.binance.com/stream"
      
    # API配置
    timeout: 10  # 请求超时时间(秒)
    max_retries: 3  # 最大重试次数
    retry_delay: 1.0  # 重试延迟(秒)
  
  # 保证金类型
  margin_type: CROSSED  # CROSSED | ISOLATED
  
  # 交易对配置
  symbols: ["BTCUSDT", "ETHUSDT", "BNBUSDT"]
  
  # 默认杠杆配置 (每个交易对的默认杠杆)
  default_leverage:
    BTCUSDT: 10
    ETHUSDT: 10
    BNBUSDT: 5
  
  # 允许的订单类型
  allowed_order_types: ["MARKET", "LIMIT", "STOP", "TAKE_PROFIT"]
  
  # 最小订单大小配置
  min_order_size:
    BTCUSDT: 0.001
    ETHUSDT: 0.01
    BNBUSDT: 0.1
  
  # 价格精度配置
  price_precision:
    BTCUSDT: 2
    ETHUSDT: 2
    BNBUSDT: 4
  
  # 数量精度配置
  quantity_precision:
    BTCUSDT: 3
    ETHUSDT: 2
    BNBUSDT: 1
  
  # 风险控制配置
  risk:
    # 最大杠杆倍数
    max_leverage: 20
    
    # 最大仓位大小 (USDT)
    max_position_size: 1000.0
    
    # 止损百分比 (2%)
    stop_loss_percentage: 0.02
    
    # 止盈百分比 (5%)
    take_profit_percentage: 0.05
    
    # 日损失限额 (USDT)
    daily_loss_limit: 500.0
    
    # 最大开仓数量
    max_open_positions: 5
    
    # 保证金要求比例 (10%)
    margin_requirement: 0.1
  
  # WebSocket配置
  websocket:
    # 启用用户数据流
    enable_user_data_stream: true
    
    # 启用市场数据流
    enable_market_data_stream: true
    
    # 重连间隔 (秒)
    reconnect_interval: 5
    
    # 最大重连尝试次数
    max_reconnect_attempts: 10
    
    # 心跳间隔 (秒)
    heartbeat_interval: 30
    
    # 缓冲区大小
    buffer_size: 1024
    
    # 连接超时 (秒)
    connection_timeout: 10
    
    # ping间隔 (秒)
    ping_interval: 20
    
    # pong超时 (秒)  
    pong_timeout: 10
  
  # 安全配置
  security:
    # API密钥配置 (从环境变量读取)
    api_key_env: "BINANCE_FUTURES_API_KEY"
    secret_key_env: "BINANCE_FUTURES_SECRET_KEY"
    
    # 是否启用签名验证
    enable_signature: true
    
    # 时间窗口 (毫秒)
    recv_window: 5000
    
    # 是否验证服务器证书
    verify_ssl: true
    
    # IP白名单验证 (可选)
    enable_ip_whitelist: false
    
  # 监控和日志配置  
  monitoring:
    # 启用性能监控
    enable_performance_monitoring: true
    
    # 启用详细日志
    enable_detailed_logging: false
    
    # 日志级别
    log_level: "INFO"  # DEBUG | INFO | WARNING | ERROR
    
    # 度量收集间隔 (秒)
    metrics_collection_interval: 60
    
    # 健康检查间隔 (秒)
    health_check_interval: 30

# 官方 binance-connector-python SDK 配置
binance_sdk:
  # API认证配置
  api:
    key: "${BINANCE_API_KEY}"
    secret: "${BINANCE_API_SECRET}"
    private_key_path: null  # RSA私钥路径 (可选)
    private_key_passphrase: null  # 私钥密码短语 (可选)
  
  # 环境配置
  environment:
    type: "testnet"  # testnet/mainnet
    auto_detect: true  # 自动检测环境
  
  # REST API配置
  rest_api:
    timeout: 10000  # 请求超时时间(毫秒)
    retries: 3  # 重试次数
    backoff: 1000  # 重试延迟(毫秒)
    keep_alive: true  # HTTP keep-alive
    compression: true  # 响应压缩
    
    # 代理配置
    proxy:
      enabled: false
      host: null
      port: null
      protocol: "http"  # http/https
      auth:
        username: null
        password: null
  
  # WebSocket API配置  
  websocket_api:
    timeout: 10000  # 超时时间(毫秒)
    reconnect_delay: 5000  # 重连延迟(毫秒)
    compression: 0  # 压缩级别 (0=禁用)
    pool_size: 3  # 连接池大小
    mode: "single"  # single/pool
    
    # 代理配置
    proxy:
      enabled: false
      host: null
      port: null
      protocol: "http"
      auth:
        username: null
        password: null
  
  # WebSocket流配置
  websocket_streams:
    timeout: 10000
    reconnect_delay: 5000
    compression: 0
    pool_size: 3
    mode: "single"
    user_agent: "ai-hedge-fund-crypto/1.0"
    
    # 代理配置
    proxy:
      enabled: false
      host: null
      port: null
      protocol: "http"
      auth:
        username: null
        password: null
  
  # 网络配置
  network:
    # HTTPS代理全局配置
    https_agent:
      verify_ssl: true
      custom_ca_path: null  # 自定义CA证书路径
      
  # 端点配置 (覆盖默认值)
  endpoints:
    # 自定义端点URL (可选)
    rest_api_base_url: null  # 如果为null则使用SDK默认值
    websocket_api_url: null
    websocket_streams_url: null